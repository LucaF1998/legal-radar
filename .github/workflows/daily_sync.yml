name: Legal Radar - Daily Background Sync

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del codice sorgente
      uses: actions/checkout@v4

    - name: Setup dell'ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installazione dipendenze enterprise
      run: |
        python -m pip install --upgrade pip
        pip install pandas feedparser requests beautifulsoup4 psycopg2-binary

    - name: Esecuzione script di ingestion asincrona
      env:
        DB_URL: ${{ secrets.DB_URL }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: python sync_worker.py
