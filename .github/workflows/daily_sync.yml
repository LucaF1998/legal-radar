name: Legal Radar - Daily Background Sync

on:
  schedule:
    # Esegue l'automazione ogni giorno alle 02:00 UTC (03:00 o 04:00 italiane in base all'ora legale)
    - cron: '0 2 * * *'
  workflow_dispatch: # Questo ti permette di testare l'automazione cliccando un tasto su GitHub

jobs:
  run-sync:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Scarica il codice dal Repository
      uses: actions/checkout@v4

    - name: 2. Configura Python sul Server Temporaneo
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Installa le librerie di scraping necessarie
      run: |
        python -m pip install --upgrade pip
        pip install pandas feedparser requests beautifulsoup4 psycopg2-binary

    - name: 4. Esegui lo script worker di sincronizzazione
      env:
        DB_URL: ${{ secrets.DB_URL }} # Passa la chiave protetta dallo storico di GitHub
      run: python sync_worker.py
